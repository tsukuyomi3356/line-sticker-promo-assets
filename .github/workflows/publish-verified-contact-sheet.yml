name: Publish one verified LINE contact sheet (manual only)
on:
  workflow_dispatch:
    inputs:
      product_id:
        description: 'LINE sticker product ID'
        required: true
        type: string
      count:
        description: 'Verified sticker count'
        required: true
        type: choice
        options: ['16','24']
permissions:
  contents: write
concurrency:
  group: publish-verified-contact-sheet
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate authentic LINE STORE contact sheet
        env:
          PRODUCT_ID: ${{ inputs.product_id }}
          COUNT: ${{ inputs.count }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRODUCT_ID" =~ ^[0-9]{7,12}$ ]] || exit 1
          case "$COUNT" in 16|24) ;; *) exit 1;; esac
          OUT="stamps/sticker-${PRODUCT_ID}-${COUNT}.jpg"
          if test -e "$OUT"; then
            echo "Already exists; refusing overwrite"
            exit 1
          fi
          python scripts/make_line_contact_sheet.py --product-id "$PRODUCT_ID" --count "$COUNT" --author "ネタさま" --output "$OUT"
          echo "IMAGE_PATH=$OUT" >> "$GITHUB_ENV"
      - name: Commit new image to public repo (no overwrite)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$IMAGE_PATH"
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Publish verified LINE sticker contact sheet"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "PUBLISHED_FILE=$IMAGE_PATH"
          echo "PUBLISHED_REF=${GITHUB_REF_NAME}"
          echo "PUBLIC_URL=https://raw.githubusercontent.com/tsukuyomi3356/line-sticker-promo-assets/${GITHUB_REF_NAME}/$IMAGE_PATH"
      - name: Verify public image from CDN
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,time,urllib.request
          from PIL import Image
          from io import BytesIO
          ref=os.environ['GITHUB_REF_NAME']
          path=os.environ['IMAGE_PATH']
          url=f'https://raw.githubusercontent.com/tsukuyomi3356/line-sticker-promo-assets/{ref}/{path}'
          for attempt in range(5):
              try:
                  with urllib.request.urlopen(url,timeout=20) as r:
                      data=r.read(6000000)
                  im=Image.open(BytesIO(data));im.verify()
                  print('PUBLIC_IMAGE_READ_OK='+url)
                  break
              except Exception:
                  if attempt==4:raise
                  time.sleep(3)
          PY
