name: LINE STORE automatic image access probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-line-store:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect published 16-sticker product (read-only)
        run: python3 scripts/probe_line_store.py
