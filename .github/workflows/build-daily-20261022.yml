name: Build daily authentic contact sheets 20261022
on:
  push:
    branches: [feature/parameterized-contact-sheet-20261021]
    paths: [scripts/build_daily_20261022.py, .github/workflows/build-daily-20261022.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-assets-20261022
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - run: python scripts/build_daily_20261022.py
      - name: Persist public image assets and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stamps/daily-20261022-*.jpg manifests/daily-20261022.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified contact-sheet manifest for 2026-10-22"
            git push origin HEAD:feature/parameterized-contact-sheet-20261021
          fi
